<?xml version="1.0" encoding="utf-8"?>
<!-- Fog: CityLAB Berlin, built from the cloud and timing of the
     (c) ammap.com SVG weather icons it sits alongside. -->
<svg
    version="1.1"
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">
    <defs>
        <filter id="blur" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="4" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.05"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <style type="text/css"><![CDATA[
@keyframes am-weather-cloud-2 {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(2px, 0px); }
}

.am-weather-cloud-2 {
  animation-name: am-weather-cloud-2;
  animation-duration: 4s;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

@keyframes am-weather-fog {
  0%, 100% { transform: translate(-2px, 0px); }
  50% { transform: translate(2px, 0px); }
}

.am-weather-fog-1,
.am-weather-fog-2 {
  animation-name: am-weather-fog;
  animation-duration: 4s;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}

.am-weather-fog-2 {
  animation-delay: -2s;
}
        ]]></style>
    </defs>
    <g filter="url(#blur)" id="fog">
        <g transform="translate(20,6)">
            <g class="am-weather-cloud-2">
                <path d="M47.7,35.4c0-4.6-3.7-8.2-8.2-8.2c-1,0-1.9,0.2-2.8,0.5c-0.3-3.4-3.1-6.2-6.6-6.2c-3.7,0-6.7,3-6.7,6.7c0,0.8,0.2,1.6,0.4,2.3    c-0.3-0.1-0.7-0.1-1-0.1c-3.7,0-6.7,3-6.7,6.7c0,3.6,2.9,6.6,6.5,6.7l17.2,0C44.2,43.3,47.7,39.8,47.7,35.4z" fill="#91C0F8" stroke="white" stroke-linejoin="round" stroke-width="1.2" transform="translate(-20,-11)"/>
            </g>
        </g>
        <g class="am-weather-fog-1">
            <line fill="none" stroke="#C6DEFF" stroke-linecap="round" stroke-width="2.5" x1="19" x2="41" y1="43" y2="43"/>
        </g>
        <g class="am-weather-fog-2">
            <line fill="none" stroke="#C6DEFF" stroke-linecap="round" stroke-width="2.5" x1="23" x2="47" y1="48" y2="48"/>
        </g>
        <g class="am-weather-fog-1">
            <line fill="none" stroke="#C6DEFF" stroke-linecap="round" stroke-width="2.5" x1="18" x2="38" y1="53" y2="53"/>
        </g>
    </g>
</svg>
